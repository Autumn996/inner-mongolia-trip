<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内蒙古 · 国庆旅行</title><style>:root{--i:#183d34;--g:#568263;--o:#d9823c;--b:#f5f1e8}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:700px;margin:auto;padding:0 16px 48px}header{margin:0 -16px;padding:42px 22px 32px;color:#fff;background:linear-gradient(#132d20bb,#132d2050),url(hero-v1.png) center/cover}h1{font-size:32px;line-height:1.2;margin:0 0 5px}.tabs{display:flex;gap:8px;overflow:auto;position:sticky;top:0;z-index:2;padding:13px 0;background:var(--b)}button{flex:none;border:0;border-radius:13px;padding:9px 13px;background:#e4ece2;color:#315b45;font:700 13px inherit}button.on{background:var(--i);color:#fff}.card{padding:16px;margin:14px 0;border:1px solid #e9e2d6;border-radius:19px;background:#fffdfa;box-shadow:0 4px 13px #42341b0b}.ey{font-size:13px;font-weight:800;letter-spacing:.08em;color:#bd6b2f}.title{font-size:24px;line-height:1.25;margin:3px 0 9px}.tag{display:inline-block;margin:0 4px 8px 0;padding:3px 9px;background:#e8f0e5;color:#477458;border-radius:99px;font-size:12px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{padding:12px;border-radius:13px;background:#eff4eb}.tile b{display:block}.day{display:grid;grid-template-columns:44px 1fr;gap:11px;padding:11px 0;border-bottom:1px solid #eee7dc}.day:last-child{border:0}.date{font-weight:800;color:var(--o)}.check{display:grid;grid-template-columns:1fr 1fr;gap:9px}.check div{padding:10px;border-radius:12px;background:#f3f6ef;font-size:14px}.map{padding:0;overflow:hidden;background:#e4eddf}.map h3{padding:11px 14px;margin:0;font-size:14px}.map svg{display:block;width:100%;height:auto}.road{fill:none;stroke:#3d7b61;stroke-width:5;stroke-linecap:round;stroke-dasharray:8 7}.pin{fill:#fff;stroke:#dc8742;stroke-width:3}.lab{font:700 13px sans-serif;fill:#183d34}.num{font:700 11px sans-serif;fill:#dc8742}.legend{padding:8px 14px 12px;font-size:12px;color:#64746b}.weather{background:#fff4e5;border-color:#efd5ad}.weather b{display:block}.wear{padding:9px;margin-top:8px;border-radius:10px;background:#f2f6ee;font-size:14px}.line{border-left:2px solid #d2dfcf;padding-left:17px;margin:7px 0}.line p{position:relative;margin:0 0 12px}.line p:before{content:"";position:absolute;left:-23px;top:8px;width:9px;height:9px;border-radius:50%;background:#6f9d72}.time{display:block;color:#377159;font-weight:800;font-size:14px}.meal{padding:10px;border:1px dashed #d6bd94;border-radius:11px;background:#fffaf2;font-size:14px}.btn{display:inline-block;margin:11px 7px 0 0;padding:8px 11px;background:var(--i);color:#fff;text-decoration:none;border-radius:10px;font-size:13px;font-weight:700}.note{font-size:12px;color:#68776e;margin:12px 2px}@media(max-width:420px){.summary,.check{grid-template-columns:1fr}}</style><main><header><h1>草原、沙漠与青城</h1><div>上海 → 呼和浩特 · 10.03 — 10.07</div></header><nav class="tabs" id="tabs"></nav><section id="app"></section><p class="note">天气当前为秋季参考区间，10 月 1 日后更新为实时预报。路线图用于理解当日顺序，实际导航以高德为准。</p></main><script>const D=[
['03','落地，奔向草原的夜','白塔机场 → 塞北驿站','辉腾锡勒 · -2–10°C','保暖内层 + 抓绒/薄羽绒 + 防风冲锋衣；日出和篝火带帽子手套。',['10:55–12:00|落地、取行李、与司机会合。','12:00–14:30|直达辉腾锡勒。','16:00–18:30|营地风车、日落慢逛。','19:00–21:30|晚餐 + 篝火（需确认）。'],'塞北驿站民宿晚餐','https://surl.amap.com/kaJCo6tfer',['白塔机场','塞北驿站']],
['04','草原日出，把风景走到尽兴','塞北驿站 → 黄花沟 → 全季酒店','辉腾锡勒 → 呼市 · -1–12°C','早晨按 0°C 准备；白天长袖 + 防风外套。',['06:30–07:30|草原日出。','09:30–13:30|黄花沟峡谷、风车与草原。','14:30–17:30|返呼市，入住全季。'],'黄花沟简餐；赛罕万达附近蒙餐/烧麦','https://uri.amap.com/marker?position=112.537638,41.130892&name=%E9%BB%84%E8%8A%B1%E6%B2%9F&coordinate=wgs84&callnative=1&src=inner_mongolia_trip',['塞北驿站','黄花沟','全季酒店']],
['05','把一整天留给沙漠','全季酒店 ↔ 响沙湾（仙沙岛）','响沙湾 · 4–18°C','长袖打底 + 防风外套；墨镜、口罩/头巾和防沙鞋套。',['06:30–07:00|酒店出发。','10:30–12:30|仙沙岛核心游玩；参考门票 ¥180，以预订页为准。','12:30–13:30|景区午餐、补水。','13:30–16:00|继续自由体验，按体力选择项目。','16:00–20:00|返回呼市。'],'响沙湾景区午餐；酒店附近晚餐','https://uri.amap.com/marker?position=109.59,40.25&name=%E5%93%8D%E6%B2%99%E6%B9%BE&coordinate=wgs84&callnative=1&src=inner_mongolia_trip',['全季酒店','响沙湾']],
['06','红色山崖，接着去敕勒川','全季酒店 → 红石崖 → 敕勒川草原','呼市周边 · 3–16°C','长袖 + 冲锋衣；红石崖风口加抓绒或薄羽绒。',['08:30–13:30|红石崖丹霞、草原观景与轻徒步。','14:30–17:30|敕勒川草原，日落前结束。','18:30 起|回市区晚饭。'],'红石崖附近午餐；塞上老街晚餐','https://uri.amap.com/search?keyword=%E7%BA%A2%E7%9F%B3%E5%B4%96%E5%9B%BD%E5%AE%B6%E7%94%9F%E6%80%81%E5%85%AC%E5%9B%AD&city=%E5%91%BC%E5%92%8C%E6%B5%A9%E7%89%B9&view=map&callnative=1&src=inner_mongolia_trip',['全季酒店','红石崖','敕勒川']],
['07','把从容留给返程','全季酒店 → 白塔机场','呼和浩特 · 4–16°C','市区秋装；机场路上备一件随手穿脱的外套。',['上午|早餐、整理行李，只在酒店附近活动。','12:30|退房、取行李。','14:20 前|抵达机场值机安检，16:20 起飞。'],'酒店附近早餐/简餐','https://uri.amap.com/search?keyword=%E5%91%BC%E5%92%8C%E6%B5%A9%E7%89%B9%E7%99%BD%E5%A1%94%E5%9B%BD%E9%99%85%E6%9C%BA%E5%9C%BA',['全季酒店','白塔机场']]];let n=-1;function map(a){let p=a[8].map((x,i)=>[70+i*(460/(a[8].length-1||1)),150+(i%2?40:-38)]),d=p.map((x,i)=>(i?'L':'M')+x).join(' ');return`<div class="card map"><h3>${a[2]}</h3><svg viewBox="0 0 600 300"><rect width="600" height="300" fill="#e4eddf"/><path d="M0 65Q140 10 280 75T600 48M0 230Q140 175 280 235T600 205" fill="none" stroke="#bdd4b8" stroke-width="20" opacity=".7"/><path d="${d}" class="road"/>${p.map((x,i)=>`<circle cx="${x[0]}" cy="${x[1]}" r="12" class="pin"/><text x="${x[0]-4}" y="${x[1]+4}" class="num">${i+1}</text><text x="${x[0]-30}" y="${x[1]-19}" class="lab">${a[8][i]}</text>`).join('')}</svg><div class="legend">1 → ${a[8].length} 为当天行程顺序</div></div>`}function overview(){return`<div class="ey">全程总览 · 5 天 4 晚</div><h2 class="title">一条从草原到沙漠的秋日路线</h2><div class="card summary"><div class="tile"><b>10/03 · 草原</b>塞北驿站蒙古包</div><div class="tile"><b>10/04–06 · 呼市</b>全季赛罕万达店</div><div class="tile"><b>核心风景</b>辉腾锡勒、黄花沟、响沙湾</div><div class="tile"><b>返程</b>10/07 16:20 白塔机场</div></div><div class="card">${D.map(x=>`<div class="day"><div class="date">10/${x[0]}</div><div><b>${x[1]}</b><br><small>${x[2]}</small></div></div>`).join('')}</div><div class="card"><b>出行清单</b><div class="check"><div><b>保暖</b><br>冲锋衣、抓绒、薄羽绒、帽子手套</div><div><b>防晒防沙</b><br>墨镜、防晒、润唇膏、头巾/口罩</div><div><b>鞋服</b><br>防水运动鞋、厚袜、长袖打底</div><div><b>实用物品</b><br>充电宝、保温杯、湿巾、密封袋</div><div><b>证件与预约</b><br>身份证、酒店订单、景区票、保险</div><div><b>药品</b><br>肠胃药、创可贴、个人常用药</div></div></div>`}function render(){tabs.innerHTML=`<button class="${n<0?'on':''}" onclick="n=-1;render()">总览</button>`+D.map((x,i)=>`<button class="${i==n?'on':''}" onclick="n=${i};render()">${x[0]} 日</button>`).join('');if(n<0){app.innerHTML=overview();return}let x=D[n];app.innerHTML=`<div class="ey">DAY ${n+1} · 10/${x[0]}</div><h2 class="title">${x[1]}</h2>${map(x)}<div class="card weather"><b>☀︎ ${x[3]}</b><small>秋季参考温度，非实时预报</small><div class="wear"><b>穿衣建议：</b>${x[4]}</div></div><div class="card"><div class="line">${x[5].map(z=>{let q=z.split('|');return`<p><span class="time">${q[0]}</span>${q[1]}</p>`}).join('')}</div><div class="meal"><b>餐位预留</b> · ${x[6]}${n==2?'<br><a href="https://xhslink.cn/o/KzzpZLRh9R">小红书：仙沙岛一日游</a><br><a href="https://xhslink.cn/o/6pU6Xl6OTNt">小红书：响沙湾玩法参考</a>':''}</div>${n==2?`<a class="btn" href="https://surl.amap.com/mSZ2zc1lfia">高德 · 全季酒店</a><a class="btn" href="${x[7]}">高德 · 响沙湾</a>`:`<a class="btn" href="${x[7]}">打开高德导航</a>`}</div>`}render();</script></html>
