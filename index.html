<!doctype html>

  <head>

    <title>内蒙古 · 国庆旅行</title>

      :root {

      }

      }

          BlinkMacSystemFont,

          sans-serif;
      }
      main {
        max-width: 700px;

        padding: 0 16px 48px;
      }

        color: #fff;
        background:

      }

      }

        overflow-x: auto;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar,
      .subtabs::-webkit-scrollbar {
        display: none;
      }
      .tabs {
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 13px 0;
        background: var(--b);
        border-bottom: 1px solid #e8e1d6;
      }
      .subtabs {
        padding: 4px 0 12px;
        margin-bottom: 8px;
      }
      button {
        flex: none;
        border: 0;
        border-radius: 13px;
        padding: 9px 13px;
        background: #e4ece2;
        color: #315b45;
        font:
          700 13px -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          sans-serif;
        cursor: pointer;
      }
      button.on {
        background: var(--i);
        color: #fff;
      }
      .card {
        padding: 16px;
        margin: 14px 0;
        border: 1px solid #e9e2d6;
        border-radius: 19px;
        background: #fffdfa;
        box-shadow: 0 4px 13px #42341b0b;
      }
      .ey {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #bd6b2f;
      }
      .title {
        font-size: 24px;
        line-height: 1.25;
        margin: 3px 0 9px;
      }
      .summary,
      .check,
      .feature-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .tile {
        padding: 12px;
        border-radius: 13px;
        background: #eff4eb;
      }
      .tile b {
        display: block;
      }
      .day {
        display: grid;
        grid-template-columns: 44px 1fr;
        gap: 11px;
        padding: 11px 0;
        border-bottom: 1px solid #eee7dc;
      }
      .day:last-child {
        border: 0;
      }
      .date {
        font-weight: 800;
        color: var(--o);
      }
      .pack-group,
      .feature {
        padding: 10px;
        border-radius: 12px;
        background: #f3f6ef;
        font-size: 14px;
      }
      .parent-spot {
        margin: 14px 0;
        padding: 16px;
        border-radius: 18px;
        background: #edf4e9;
        border: 1px solid #d8e6d3;
      }
      .parent-spot h3 {
        margin: 0 0 5px;
        font-size: 19px;
      }
      .child-spots {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }
      .child-spot {
        padding: 10px;
        border-radius: 11px;
        background: #fffdfa;
        font-size: 14px;
      }
      .child-spot small {
        color: #64746b;
      }
      .feature b {
        display: block;
        font-size: 16px;
      }
      .feature p {
        margin: 4px 0;
      }
      .food-category h3 {
        margin: 0 0 7px;
        color: var(--i);
        font-size: 18px;
      }
      .food-category > p {
        margin: 0;
      }
      .food-place {
        padding: 11px 0;
        border-top: 1px solid #e8e9de;
      }

      .food-category > p + .food-place {
        margin-top: 10px;
      }
      .food-place b {
        display: block;
      }
      .food-place p {
        margin: 4px 0 0;
        color: #52665c;
        font-size: 14px;
      }

        overflow: hidden;
      }

        display: block;
      }
      .itinerary-poster img {
        width: 100%;
        height: auto;
      }
      .itinerary-poster figcaption {
        padding: 9px 14px;
        color: #64746b;
        font-size: 12px;
      }

        fill: none;
        stroke: #3d7b61;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-dasharray: 8 7;
      }
      .pin {
        fill: #fff;
        stroke: #dc8742;
        stroke-width: 3;
      }
      .lab {
        font: 700 13px sans-serif;
        fill: #183d34;
      }
      .num {
        font: 700 11px sans-serif;
        fill: #dc8742;
      }
      .legend {
        padding: 8px 14px 12px;
        font-size: 12px;
        color: #64746b;
      }
      .weather {
        background: #fff4e5;
        border-color: #efd5ad;
      }
      .weather b {
        display: block;
      }
      .weather-link {
        background: #fffaf0;
        border: 1px solid #dec58f;
        color: #725d32;
        box-shadow: 0 2px 0 rgba(157, 120, 57, 0.1);
      }

        padding: 9px;
        margin-top: 8px;
        border-radius: 10px;
        background: #f2f6ee;
        font-size: 14px;
      }
      .line {
        border-left: 2px solid #d2dfcf;
        padding-left: 17px;
        margin: 7px 0;
      }
      .line p {
        position: relative;
        margin: 0 0 12px;
      }
      .line p:before {
        content: "";
        position: absolute;
        left: -23px;
        top: 8px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #6f9d72;
      }
      .time {
        display: block;
        color: #377159;
        font-weight: 800;
        font-size: 14px;
      }
      .meal {
        padding: 10px;
        border: 1px dashed #d6bd94;
        border-radius: 11px;
        background: #fffaf2;
        font-size: 14px;
      }
      .reference-card > small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
      }
      .reference-group {
        margin-top: 13px;
        padding-top: 11px;
        border-top: 1px dashed #d6dfd2;
      }
      .reference-group strong,
      .reference-group a {
        display: block;
      }
      .reference-group a {
        margin-top: 7px;
        color: #377159;
        font-size: 14px;
        font-weight: 700;
      }
      .nav-links {
        margin-top: 14px;
        padding-top: 13px;
        border-top: 1px solid #e8e1d4;
      }
      .nav-links b,
      .nav-links small {
        display: block;
      }
      .nav-links small {
        margin-top: 4px;
        color: var(--muted);
      }
      .btn {
        display: inline-block;
        margin: 11px 7px 0 0;
        padding: 8px 11px;
        background: var(--i);
        color: #fff;
        text-decoration: none;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 700;
      }
      .note {
        font-size: 12px;
        color: #68776e;
        margin: 12px 2px;
      }
      .tip {
        border-left: 3px solid var(--g);
        padding-left: 12px;
        margin: 14px 0;
      }
      .tick {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        padding: 8px 0;
      }
      .tick input {
        margin-top: 6px;
        accent-color: var(--i);
      }
      @media (max-width: 420px) {
        .summary,
        .check,
        .feature-grid,
        .child-spots {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

            <h3>红召九龙湾</h3>
            <p>位于乌兰察布市卓资县红召乡一带，以森林、峡谷、山水与山地观景为特色，已安排在 10/06 下午。两篇笔记分别侧重溪谷游玩和登山赏秋；这趟优先看白桦林秋色、峡谷和短段山地视野，玻璃栈道可选，漂流按当日开放与体感决定，不与完整登山叠加。</p>

          <div class="card"><b>小红书参考</b><p>店铺和口味评价来自两篇个人分享；新笔记中有一家卓资路边店未记店名，暂未列入。</p><a href="https://xhslink.cn/o/1pX8Q0qcSOE" target="_blank" rel="noopener noreferrer">本地人最爱的呼和浩特蒙餐馆 ↗</a><br><a href="https://xhslink.cn/o/6a33e5RsklZ" target="_blank" rel="noopener noreferrer">没想到呼和浩特这么好吃 ↗</a></div>
          <p class="note">高德按钮在新标签页打开，沿用网页入口，由高德处理跳转 App。老贝尔打开门店分享页；德乐海、格日勒阿妈市政府西门店打开单点位置；其余店铺打开找店结果，请按上方分店说明选择。菜单、营业时间和国庆价格以店铺最新信息为准。</p>`;
      }
      function detail() {
        const x = D[dayIndex];
        const poster = ITINERARY_POSTERS[dayIndex];
        const routeVisual = poster
          ? `<figure class="card itinerary-poster"><a href="${poster[0]}" target="_blank" rel="noopener noreferrer" aria-label="查看 10/${x[0]} 手绘行程大图"><img src="${poster[0]}" alt="${poster[1]}" width="1024" height="1536" decoding="async"></a><figcaption>点按图片查看大图。行程顺序示意，非地理地图；天气参考查询日期 ${WEATHER_QUERIED_AT[dayIndex]}，具体时间与地点跳转见下方。</figcaption></figure>`
          : map(x);
        return `<div class="ey">每日行程 · 5 天</div><h2 class="title">每天的具体安排</h2><nav class="subtabs" id="day-tabs" aria-label="选择日期">${D.map((d, i) => `<button type="button" class="${i === dayIndex ? "on" : ""}" data-day="${i}" aria-pressed="${i === dayIndex}">10/${d[0]}</button>`).join("")}</nav><div class="ey">${dayIndex === 3 ? "" : `DAY ${dayIndex + 1} · `}10/${x[0]}</div><h2 class="title">${x[1]}</h2>${routeVisual}<div class="card weather"><b>${x[3]}</b><small>中国天气网 · 查询日期 ${WEATHER_QUERIED_AT[dayIndex]} · 未来 7 天预报；本页非自动更新。温度为全天最低～最高，县市预报供景区参考。</small><a class="btn weather-link" href="${WEATHER_LINKS[dayIndex][1]}" target="_blank" rel="noopener noreferrer">中国天气网 · ${WEATHER_LINKS[dayIndex][0]}详细天气 ↗</a>${dayIndex === 3 ? '<a class="btn weather-link" href="https://www.weather.com.cn/weather/101080402.shtml" target="_blank" rel="noopener noreferrer">中国天气网 · 卓资（九龙湾参考）详细天气 ↗</a>' : ""}${dayIndex <= 3 ? '<a class="btn weather-link" href="https://www.weather.com.cn/weather/101080101.shtml" target="_blank" rel="noopener noreferrer">中国天气网 · 呼和浩特详细天气 ↗</a>' : ""}<div class="wear"><b>穿衣建议：</b>${x[4]}</div></div>${dayExtras(dayIndex)}<div class="card"><div class="line">${x[5]
          .map((z) => {
            const q = z.split("|");
            return `<p><span class="time">${q[0]}</span>${q[1]}</p>`;
          })
          .join(
            "",
          )}</div><div class="meal"><b>餐位预留</b> · ${x[6]}</div></div>${xiaohongshuRefs(dayIndex)}<div class="card"><div class="nav-links"><b>当天地点导航</b><small>点击打开高德地点；带「备选」的地点不代表一定前往。</small>${x[9].map(([name, href]) => `<a class="btn" href="${href}" target="_blank" rel="noopener noreferrer">高德 · ${name}</a>`).join("")}</div></div>`;
      }
      function render() {
        tabs.innerHTML = sections
          .map(
            ([key, label]) =>
              `<button type="button" class="${key === section ? "on" : ""}" data-section="${key}" aria-pressed="${key === section}">${label}</button>`,
          )
          .join("");
        app.innerHTML = { overview, prepare, sights, food, details: detail }[
          section
        ]();
        if (section === "prepare") {
          document.querySelectorAll("[data-check]").forEach((input) => {
            input.checked = !!state.checks[input.dataset.check];
            input.addEventListener("change", () => {
              state.checks[input.dataset.check] = input.checked;
              persist();
              updatePackCount();
            });
          });
          updatePackCount();
        }
      }
      tabs.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-section]");
        if (!btn) return;
        section = btn.dataset.section;
        render();
      });
      app.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-day]");
        if (!btn) return;
        dayIndex = Number(btn.dataset.day);
        render();
      });
      render();
    </script>
  </body>
</html>
