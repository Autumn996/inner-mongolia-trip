<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#183d34" />
    <title>内蒙古 · 国庆旅行</title>
    <style>
      :root {
        --i: #183d34;
        --g: #568263;
        --o: #d9823c;
        --b: #f5f1e8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--b);
        color: var(--i);
        font:
          16px/1.6 -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          sans-serif;
      }
      main {
        max-width: 700px;
        margin: auto;
        padding: 0 16px 48px;
      }
      header {
        margin: 0 -16px;
        padding: 42px 22px 32px;
        color: #fff;
        background:
          linear-gradient(#132d20bb, #132d2050),
          url(hero-v1.png) center/cover;
      }
      h1 {
        font-size: 32px;
        line-height: 1.2;
        margin: 0 0 5px;
      }
      .tabs,
      .subtabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar,
      .subtabs::-webkit-scrollbar {
        display: none;
      }
      .tabs {
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 13px 0;
        background: var(--b);
        border-bottom: 1px solid #e8e1d6;
      }
      .subtabs {
        padding: 4px 0 12px;
        margin-bottom: 8px;
      }
      button {
        flex: none;
        border: 0;
        border-radius: 13px;
        padding: 9px 13px;
        background: #e4ece2;
        color: #315b45;
        font:
          700 13px -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          sans-serif;
        cursor: pointer;
      }
      button.on {
        background: var(--i);
        color: #fff;
      }
      .card {
        padding: 16px;
        margin: 14px 0;
        border: 1px solid #e9e2d6;
        border-radius: 19px;
        background: #fffdfa;
        box-shadow: 0 4px 13px #42341b0b;
      }
      .ey {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #bd6b2f;
      }
      .title {
        font-size: 24px;
        line-height: 1.25;
        margin: 3px 0 9px;
      }
      .summary,
      .check,
      .feature-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .tile {
        padding: 12px;
        border-radius: 13px;
        background: #eff4eb;
      }
      .tile b {
        display: block;
      }
      .day {
        display: grid;
        grid-template-columns: 44px 1fr;
        gap: 11px;
        padding: 11px 0;
        border-bottom: 1px solid #eee7dc;
      }
      .day:last-child {
        border: 0;
      }
      .date {
        font-weight: 800;
        color: var(--o);
      }
      .pack-group,
      .feature {
        padding: 10px;
        border-radius: 12px;
        background: #f3f6ef;
        font-size: 14px;
      }
      .parent-spot {
        margin: 14px 0;
        padding: 16px;
        border-radius: 18px;
        background: #edf4e9;
        border: 1px solid #d8e6d3;
      }
      .parent-spot h3 {
        margin: 0 0 5px;
        font-size: 19px;
      }
      .child-spots {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }
      .child-spot {
        padding: 10px;
        border-radius: 11px;
        background: #fffdfa;
        font-size: 14px;
      }
      .child-spot small {
        color: #64746b;
      }
      .feature b {
        display: block;
        font-size: 16px;
      }
      .feature p {
        margin: 4px 0;
      }
      .map {
        padding: 0;
        overflow: hidden;
        background: #e4eddf;
      }
      .map h3 {
        padding: 11px 14px;
        margin: 0;
        font-size: 14px;
      }
      .map svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .itinerary-poster {
        padding: 0;
        overflow: hidden;
      }
      .itinerary-poster a,
      .itinerary-poster img {
        display: block;
      }
      .itinerary-poster img {
        width: 100%;
        height: auto;
      }
      .itinerary-poster figcaption {
        padding: 9px 14px;
        color: #64746b;
        font-size: 12px;
      }
      .road {
        fill: none;
        stroke: #3d7b61;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-dasharray: 8 7;
      }
      .pin {
        fill: #fff;
        stroke: #dc8742;
        stroke-width: 3;
      }
      .lab {
        font: 700 13px sans-serif;
        fill: #183d34;
      }
      .num {
        font: 700 11px sans-serif;
        fill: #dc8742;
      }
      .legend {
        padding: 8px 14px 12px;
        font-size: 12px;
        color: #64746b;
      }
      .weather {
        background: #fff4e5;
        border-color: #efd5ad;
      }
      .weather b {
        display: block;
      }
      .weather-link {
        background: #fffaf0;
        border: 1px solid #dec58f;
        color: #725d32;
        box-shadow: 0 2px 0 rgba(157, 120, 57, 0.1);
      }
      .wear {
        padding: 9px;
        margin-top: 8px;
        border-radius: 10px;
        background: #f2f6ee;
        font-size: 14px;
      }
      .line {
        border-left: 2px solid #d2dfcf;
        padding-left: 17px;
        margin: 7px 0;
      }
      .line p {
        position: relative;
        margin: 0 0 12px;
      }
      .line p:before {
        content: "";
        position: absolute;
        left: -23px;
        top: 8px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #6f9d72;
      }
      .time {
        display: block;
        color: #377159;
        font-weight: 800;
        font-size: 14px;
      }
      .meal {
        padding: 10px;
        border: 1px dashed #d6bd94;
        border-radius: 11px;
        background: #fffaf2;
        font-size: 14px;
      }
      .reference-card > small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
      }
      .reference-group {
        margin-top: 13px;
        padding-top: 11px;
        border-top: 1px dashed #d6dfd2;
      }
      .reference-group strong,
      .reference-group a {
        display: block;
      }
      .reference-group a {
        margin-top: 7px;
        color: #377159;
        font-size: 14px;
        font-weight: 700;
      }
      .nav-links {
        margin-top: 14px;
        padding-top: 13px;
        border-top: 1px solid #e8e1d4;
      }
      .nav-links b,
      .nav-links small {
        display: block;
      }
      .nav-links small {
        margin-top: 4px;
        color: var(--muted);
      }
      .btn {
        display: inline-block;
        margin: 11px 7px 0 0;
        padding: 8px 11px;
        background: var(--i);
        color: #fff;
        text-decoration: none;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 700;
      }
      .note {
        font-size: 12px;
        color: #68776e;
        margin: 12px 2px;
      }
      .tip {
        border-left: 3px solid var(--g);
        padding-left: 12px;
        margin: 14px 0;
      }
      .tick {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        padding: 8px 0;
      }
      .tick input {
        margin-top: 6px;
        accent-color: var(--i);
      }
      @media (max-width: 420px) {
        .summary,
        .check,
        .feature-grid,
        .child-spots {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

              updatePackCount();

          });
          updatePackCount();
        }
      }
      tabs.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-section]");
        if (!btn) return;
        section = btn.dataset.section;
        render();
      });
      app.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-day]");
        if (!btn) return;
        dayIndex = Number(btn.dataset.day);
        render();
      });
      render();
    </script>
  </body>
</html>
